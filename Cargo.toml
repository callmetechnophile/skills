[workspace]
resolver = "2"
members = [
    "crates/router-core",
    "crates/task-intelligence",
    "crates/issue-analyzer",
    "crates/skill-registry",
    "crates/skill-discovery",
    "crates/skill-ranking",
    "crates/skill-security",
    "crates/skill-activation",
    "crates/agent-orchestrator",
    "crates/runtime-adapters",
    "crates/skill-lifecycle",
    "crates/execution-engine",
    "crates/router-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["callmetechnophile"]
license = "Apache-2.0"

[workspace.dependencies]
router-core = { path = "crates/router-core" }
task-intelligence = { path = "crates/task-intelligence" }
issue-analyzer = { path = "crates/issue-analyzer" }
skill-registry = { path = "crates/skill-registry" }
skill-discovery = { path = "crates/skill-discovery" }
skill-ranking = { path = "crates/skill-ranking" }
skill-security = { path = "crates/skill-security" }
skill-activation = { path = "crates/skill-activation" }
agent-orchestrator = { path = "crates/agent-orchestrator" }
runtime-adapters = { path = "crates/runtime-adapters" }
skill-lifecycle = { path = "crates/skill-lifecycle" }

tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "1.0"
tracing = "0.1"
petgraph = "0.6"
sha2 = "0.10"
regex = "1.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

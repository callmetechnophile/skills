name: test
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Validate CLI syntax
        run: |
          node --check src/router.mjs
          node --check src/registry.mjs
          node --check scripts/sync-skillsdirectory.mjs
          node --check scripts/find-skill.mjs
          node --check scripts/install-skill.mjs
